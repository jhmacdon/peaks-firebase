name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  check-cross-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cross-reference checks
        run: ./scripts/check-cross-refs.sh

  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Lint
        run: npm run lint
        working-directory: functions

      - name: Build
        run: npm run build
        working-directory: functions

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions,firestore:rules,storage --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  # Lint + the full API suite, including the DB-backed integration tests, which
  # only run when TEST_DATABASE_URL names a provisioned test database. Before
  # this job existed those ~11 files silently skipped in CI: nothing ever set the
  # gate, so the triggers, plpgsql and spatial matching they cover were only
  # exercised by hand, against production.
  #
  # The service container is disposable and isolated, so nothing here can reach
  # production even by accident. It runs at the same default concurrency as a
  # local run — see cloud-sql/test-db/README.md.
  test-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Production is PostgreSQL 15.17 + PostGIS 3.6.0. The postgis images
        # stop at 3.5 for PG 15; matching the Postgres major matters more here
        # than the PostGIS minor, since every spatial function the suite touches
        # (ST_DWithin, ST_Covers, ST_MakeLine, ST_Subdivide, ST_HausdorffDistance)
        # is unchanged between 3.5 and 3.6.
        image: postgis/postgis:15-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peaks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloud-sql/api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cloud-sql/api

      - name: Lint
        run: npx eslint src/
        working-directory: cloud-sql/api

      - name: Provision test database
        run: ./cloud-sql/test-db/provision.sh
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/peaks_test
          TEST_DB_ROLE: peaks_test
          TEST_DB_ROLE_PASSWORD: peaks_test

      - name: Test
        run: npm run test:db
        working-directory: cloud-sql/api
        env:
          TEST_DATABASE_URL: postgres://peaks_test:peaks_test@localhost:5432/peaks_test

  deploy-api:
    needs: test-api
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloud-sql/api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cloud-sql/api

      - name: Build
        run: npm run build
        working-directory: cloud-sql/api

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: peaks-api
          region: us-central1
          source: cloud-sql/api
          # Pin resource + scaling config. The default 256Mi OOMed under
          # session-sync bursts (/sessions + /:id/points), returning 503 to
          # everything on the instance — including fast /api/search — which is
          # what made search look slow/broken. The /points + /elevation endpoints
          # now STREAM via a server-side cursor (constant memory), so 512Mi is
          # enough. Keep request fanout near DB limits by reducing concurrency and
          # explicitly capping pool size via DB_POOL_MAX.
          # --cpu-throttling (request-based billing): CPU is only allocated
          # while a request is in flight, which cuts the always-on min
          # instance from ~$50/mo to single digits. The stuck-session sweep
          # no longer relies on an in-process timer — Cloud Scheduler job
          # `peaks-api-sweep` POSTs /internal/sweep every 2 minutes with an
          # OIDC token (peaks-sweeper@ SA), and that request provides the CPU
          # window the sweep runs in.
          # --min-instances=0: cold starts on first search are acceptable
          # (Josiah, 2026-07-21), and the 2-minute scheduler sweep keeps an
          # instance warm most of the time anyway.
          flags: '--memory=512Mi --cpu=1 --concurrency=20 --min-instances=0 --max-instances=6 --cpu-throttling'
          # Pin all required env vars and secrets so deploys can never drop them
          env_vars: |
            INSTANCE_CONNECTION_NAME=donner-a8608:us-central1:peaks-db
            DB_NAME=peaks
            DB_USER=peaks-api
            DB_POOL_MAX=4
            DB_POOL_CONNECTION_TIMEOUT_MS=5000
            FIREBASE_STORAGE_BUCKET=donner-a8608.appspot.com
          secrets: |
            DB_PASS=peaks-db-password:latest
            SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe peaks-api --region=us-central1 --format="value(status.url)")
          echo "Service URL: $URL"

          # Health check
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Health check failed with HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed"

          # Database connectivity check — /api/* requires auth so a 401 means
          # the app booted and connected to the DB. A 503 means DB is unreachable.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/lists")
          if [ "$STATUS" = "503" ]; then
            echo "::error::Database connectivity check failed — got 503 (service crash, likely missing DB_PASS)"
            gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="peaks-api" AND severity>=ERROR' --limit=5 --format="table(timestamp, textPayload)"
            exit 1
          fi
          echo "Database connectivity check passed (HTTP $STATUS)"

  deploy-smoke-job:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloud-sql/smoke-job/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cloud-sql/smoke-job

      - name: Lint
        run: npm run lint
        working-directory: cloud-sql/smoke-job

      - name: Test
        run: npm test
        working-directory: cloud-sql/smoke-job

      - name: Build
        run: npm run build
        working-directory: cloud-sql/smoke-job

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # deploy-cloudrun's `job` input can't source-build, so use gcloud
      # directly. Like deploy-api, the FULL env/secret set is pinned here on
      # every deploy — never update it out-of-band.
      - name: Deploy Cloud Run job
        run: |
          gcloud run jobs deploy peaks-smoke-job \
            --source=cloud-sql/smoke-job \
            --region=us-central1 \
            --set-cloudsql-instances=donner-a8608:us-central1:peaks-db \
            --set-env-vars=INSTANCE_CONNECTION_NAME=donner-a8608:us-central1:peaks-db,DB_NAME=peaks,DB_USER=peaks-api \
            --set-secrets=DB_PASS=peaks-db-password:latest \
            --memory=512Mi \
            --task-timeout=900 \
            --max-retries=1 \
            --quiet
