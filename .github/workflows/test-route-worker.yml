name: Test route worker

on:
  pull_request:
    paths:
      - ".agents/skills/peaks-route-factory/**"
      - ".codex/agents/peaks-route-reviewer.toml"
      - ".claude/skills/peaks-osm-route-approval/**"
      - ".claude/skills/peaks-standard-route-backfill/**"
      - ".claude/skills/peaks-route-catalog-audit/**"
      - ".claude/skills/peaks-route-elevation-backfill/**"
      - "cloud-sql/migrate/**"
      - "web/src/lib/actions/routes.ts"
      - ".github/workflows/test-route-worker.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/peaks-route-factory/**"
      - ".codex/agents/peaks-route-reviewer.toml"
      - ".claude/skills/peaks-osm-route-approval/**"
      - ".claude/skills/peaks-standard-route-backfill/**"
      - ".claude/skills/peaks-route-catalog-audit/**"
      - ".claude/skills/peaks-route-elevation-backfill/**"
      - "cloud-sql/migrate/**"
      - "web/src/lib/actions/routes.ts"
      - ".github/workflows/test-route-worker.yml"

jobs:
  test-route-worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.5
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peaks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            cloud-sql/migrate/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cloud-sql/migrate

      - name: Provision disposable route database
        run: ./cloud-sql/test-db/provision.sh
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/peaks_test
          TEST_DB_ROLE: peaks_test
          TEST_DB_ROLE_PASSWORD: peaks_test

      - name: Build and test
        run: |
          npm run build
          npm test
        working-directory: cloud-sql/migrate
        env:
          ROUTE_JOB_TEST_DATABASE_URL: postgres://peaks_test:peaks_test@localhost:5432/peaks_test
          ROUTE_AUDIT_JOB_TEST_DATABASE_URL: postgres://peaks_test:peaks_test@localhost:5432/peaks_test
          ROUTE_ELEVATION_JOB_TEST_DATABASE_URL: postgres://peaks_test:peaks_test@localhost:5432/peaks_test

      - name: Test Luna route skills
        run: |
          .agents/skills/peaks-route-factory/scripts/test_worker_checkout_resolution.sh
          node --test .claude/skills/peaks-route-catalog-audit/scripts/route_audit_tools.test.mjs

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Check route activation
        run: |
          npx tsc --noEmit --pretty false
          npm run lint -- --max-warnings=0
        working-directory: web
