name: Test route worker

on:
  pull_request:
    paths:
      - ".agents/skills/peaks-route-factory/**"
      - ".codex/agents/peaks-route-reviewer.toml"
      - ".claude/skills/peaks-osm-route-approval/**"
      - ".claude/skills/peaks-standard-route-backfill/**"
      - "cloud-sql/migrate/**"
      - "web/src/lib/actions/routes.ts"
      - ".github/workflows/test-route-worker.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/peaks-route-factory/**"
      - ".codex/agents/peaks-route-reviewer.toml"
      - ".claude/skills/peaks-osm-route-approval/**"
      - ".claude/skills/peaks-standard-route-backfill/**"
      - "cloud-sql/migrate/**"
      - "web/src/lib/actions/routes.ts"
      - ".github/workflows/test-route-worker.yml"

jobs:
  test-route-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            cloud-sql/migrate/package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cloud-sql/migrate

      - name: Build and test
        run: |
          npm run build
          npm test
        working-directory: cloud-sql/migrate

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Check route activation
        run: |
          npx tsc --noEmit --pretty false
          npm run lint -- --max-warnings=0
        working-directory: web
