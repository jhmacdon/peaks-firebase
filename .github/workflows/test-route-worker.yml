name: Test route worker

on:
  pull_request:
    paths:
      - ".agents/skills/peaks-route-factory/**"
      - ".claude/skills/peaks-standard-route-backfill/**"
      - "cloud-sql/migrate/**"
      - ".github/workflows/test-route-worker.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/peaks-route-factory/**"
      - ".claude/skills/peaks-standard-route-backfill/**"
      - "cloud-sql/migrate/**"
      - ".github/workflows/test-route-worker.yml"

jobs:
  test-route-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloud-sql/migrate/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: cloud-sql/migrate

      - name: Build and test
        run: |
          npm run build
          npm test
        working-directory: cloud-sql/migrate
